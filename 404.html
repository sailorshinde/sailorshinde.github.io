<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Gaurav Shinde</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" />
    <style>
      :root { --bg: oklch(0.983 0.017 88.0); --fg: oklch(0.198 0.041 262.2); --muted: oklch(0.420 0.014 269.4); --on: oklch(1 0 89.9); --ring: #BF3A1B; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.5; }
      main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
      .card { max-width: 28rem; text-align: center; }
      h1 { font-family: "Newsreader", Georgia, serif; font-size: 4.5rem; line-height: 1; margin: 0; font-weight: 500; }
      h2 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0; }
      p { color: var(--muted); font-size: 0.875rem; margin: 0.5rem 0 0; }
      a { display: inline-flex; margin-top: 1.5rem; padding: 0.5rem 1rem; border-radius: 0.375rem; background: var(--fg); color: var(--on); font-size: 0.875rem; font-weight: 500; text-decoration: none; }
      a:hover { opacity: 0.9; }
      a:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/">Go home</a>
      </div>
    </main>
  </body>
</html>
